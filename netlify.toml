# Netlify build for the Nightshift web app.
#
# The same bundle that becomes the Android APK also runs as an installable
# web app, so a parent can open it on any phone without sideloading anything.
#
# Set VITE_API_URL in Site settings → Environment variables to point the
# deployed app at your server. Without it the app runs fully on-device.

[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "app/dist"

[build.environment]
  # The Capacitor CLI requires Node 22, and the build runs it.
  NODE_VERSION = "22"

# The app uses hash routing, but a stray deep link should still land somewhere
# rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Microphone is the whole product; the app asks for it explicitly.
    Permissions-Policy = "microphone=(self), geolocation=(), camera=()"

# Hashed assets never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must not be cached, or updates never reach anyone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
