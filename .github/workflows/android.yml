name: Build Android APK

# The APK is built here rather than locally because GitHub's runners ship the
# Android SDK. Download the artifact from the run summary, or grab it from the
# Release that a tag build creates.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which variant to build'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level env so the signing steps can branch on it; a secret cannot be
    # read directly from a step-level `if`.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc -b --noEmit

      - name: Build web bundle
        working-directory: app
        run: npm run build

      - name: Regenerate native icons and splash
        working-directory: app
        run: |
          node tools/make-icons.mjs
          node tools/make-android-assets.mjs

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      # The APK compiled fine and crashed on launch once, because the Gradle
      # namespace was renamed and MainActivity.java was left in the old
      # package. The manifest's ".MainActivity" is resolved at runtime, so
      # nothing at build time noticed. This is that check.
      - name: Verify the app can actually launch
        working-directory: app/android
        run: |
          set -euo pipefail

          namespace=$(grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle)
          echo "Gradle namespace: $namespace"

          activity=$(find app/src/main/java -name 'MainActivity.*' | head -1)
          if [ -z "$activity" ]; then
            echo "::error::No MainActivity source found at all."
            exit 1
          fi

          declared=$(grep -oP '^package\s+\K[A-Za-z0-9_.]+' "$activity")
          echo "MainActivity package: $declared"

          if [ "$namespace" != "$declared" ]; then
            echo "::error::MainActivity is in '$declared' but the manifest will look for it in '$namespace'. The app would install and then crash instantly with ClassNotFoundException."
            exit 1
          fi

          expected_path="app/src/main/java/$(echo "$declared" | tr '.' '/')/MainActivity.java"
          if [ ! -f "$expected_path" ]; then
            echo "::error::MainActivity.java is not on its package path ($expected_path)."
            exit 1
          fi

          echo "✓ MainActivity resolves: $namespace.MainActivity"

      # A launcher activity that is not exported, or missing entirely, is the
      # other way an APK installs and then does nothing when tapped.
      - name: Verify the launcher intent
        working-directory: app/android
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml

          grep -q 'android.intent.action.MAIN' "$manifest" \
            || { echo "::error::No MAIN intent — the app would have no icon to tap."; exit 1; }
          grep -q 'android.intent.category.LAUNCHER' "$manifest" \
            || { echo "::error::No LAUNCHER category — the app would not appear in the launcher."; exit 1; }
          grep -q 'android:exported="true"' "$manifest" \
            || { echo "::error::Launcher activity is not exported — Android 12+ refuses to start it."; exit 1; }

          echo "✓ Launcher intent is complete and exported"

      # The app shipped once with RECORD_AUDIO but not MODIFY_AUDIO_SETTINGS.
      # Capacitor's WebChromeClient requests both for a getUserMedia() call and
      # grants the WebView only if every permission comes back granted, while
      # Android auto-denies an undeclared permission without showing a dialog.
      # The result was a microphone that could never work and never said why.
      - name: Verify the microphone can actually be granted
        working-directory: app/android
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml

          if ! grep -rq 'getUserMedia' ../src; then
            echo "App does not record audio — skipping."
            exit 0
          fi

          for perm in RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$perm" "$manifest" || {
              echo "::error::The app calls getUserMedia but the manifest is missing android.permission.$perm. Capacitor requests RECORD_AUDIO and MODIFY_AUDIO_SETTINGS together and denies the WebView unless both are granted; Android silently denies any permission the manifest does not declare. Recording would fail with no prompt and no explanation."
              exit 1
            }
          done

          echo "✓ Microphone permissions are complete"

      # The app shipped once reading stories through the Web Speech API alone.
      # Android's System WebView exposes window.speechSynthesis but ships no
      # voices with it, so speak() was a no-op and every story played in
      # silence — while the phone's own TextToSpeech engine sat unused one
      # layer down. Anything that reads aloud must be able to reach it.
      - name: Verify stories can actually be spoken on a phone
        working-directory: app
        run: |
          set -euo pipefail

          for f in $(grep -rl 'speechSynthesis' src --include='*.ts' --include='*.tsx'); do
            case "$f" in
              *RecordingStudio*) continue ;;  # only cancels, never speaks
            esac
            grep -q '@capacitor-community/text-to-speech' "$f" || {
              echo "::error::$f speaks through the Web Speech API with no native fallback. Android's WebView has no voices, so this plays silently on a real phone. Route it through the TextToSpeech plugin."
              exit 1
            }
          done

          echo "✓ Every read-aloud path can reach the phone's speech engine"

      # A release build is only signed when the repository has a keystore.
      # Without one we still produce an installable debug APK.
      - name: Decode signing keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        working-directory: app/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # One stable filename, so the rolling release always has exactly one
      # APK on it. A download page with three similarly-named files is how
      # someone ends up installing last week's build and reporting a bug that
      # was fixed on Tuesday. The version lives in the release notes.
      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/StoryStation.apk
          if [ -f app/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp app/android/app/build/outputs/apk/release/app-release.apk out/StoryStation-signed.apk
          fi
          ls -la out

      # Older builds used a versioned filename, so they are still sitting on
      # the rolling release. Clear anything that is not the current asset.
      - name: Remove superseded APKs from the rolling release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}"
          release_id=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "$api/releases/tags/android-latest" | jq -r '.id // empty')

          if [ -z "$release_id" ]; then
            echo "No rolling release yet — nothing to clean."
            exit 0
          fi

          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "$api/releases/$release_id/assets" \
            | jq -r '.[] | select(.name | test("StoryStation.*\\.apk$") | not) | "\(.id) \(.name)"' \
            | while read -r id name; do
                echo "Deleting superseded asset: $name"
                curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$id"
              done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: story-station-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 90
          if-no-files-found: error

      # A CI artifact is a ZIP, and Android cannot install from a ZIP — on a
      # phone you need a file manager just to unpack it. A release asset is a
      # direct .apk URL you tap once, so every build publishes one.
      - name: Publish installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Story Station — latest Android build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: out/*.apk
          fail_on_unmatched_files: true
          body: |
            **Build ${{ github.run_number }}** · `${{ github.sha }}`

            # 📱 How to install

            **Do this on the Android phone, not on a computer.**

            ### 1. Scroll down to **Assets** and tap `StoryStation.apk`
            There is only ever one file here. It downloads in a few seconds.

            ### 2. Tap the download when it finishes
            Look in your notifications, or open **Files → Downloads**.

            ### 3. Android will say it can't install from this source
            Tap **Settings** → turn on **Allow from this source** → tap **Back**.
            This is normal for any app that did not come from the Play Store.

            ### 4. Tap **Install**, then **Open**

            ---

            # ▶️ What to do first

            The app walks you through it, but in short:

            1. **Add your child** — takes thirty seconds.
            2. **Record ten short songs.** Most are under a minute. This is the
               only recording you ever have to do.
            3. That's it. Every story, book and song then reads itself **in your
               voice**, and one is sent automatically every night.

            Until you record, stories are read by the phone and clearly labelled
            **"Device narrator — not a real voice"** — because it isn't you yet.

            ---

            ### If something doesn't work

            - **No sound and no words lighting up?** Your phone has no text-to-speech
              voice installed. The app detects this and highlights the words at
              reading pace instead, so you can read along together.
            - **Microphone not working?** Allow microphone access when asked. If you
              said no the first time, it's in Android Settings → Apps → Story Station
              → Permissions.
