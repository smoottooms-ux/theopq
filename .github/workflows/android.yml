name: Build Android APK

# The APK is built here rather than locally because GitHub's runners ship the
# Android SDK. Download the artifact from the run summary, or grab it from the
# Release that a tag build creates.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which variant to build'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level env so the signing steps can branch on it; a secret cannot be
    # read directly from a step-level `if`.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc -b --noEmit

      - name: Build web bundle
        working-directory: app
        run: npm run build

      - name: Regenerate native icons and splash
        working-directory: app
        run: |
          node tools/make-icons.mjs
          node tools/make-android-assets.mjs

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      # A release build is only signed when the repository has a keystore.
      # Without one we still produce an installable debug APK.
      - name: Decode signing keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        working-directory: app/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
             "out/nightshift-debug-1.0.${{ github.run_number }}.apk"
          if [ -f app/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp app/android/app/build/outputs/apk/release/app-release.apk \
               "out/nightshift-release-1.0.${{ github.run_number }}.apk"
          fi
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
