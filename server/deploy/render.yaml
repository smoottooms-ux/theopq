# Render deployment. Commit this, then point a Render Blueprint at the repo.
#
# The disk is the whole product: it holds the database and every recording.
# Keep the plan on a single instance — SQLite has exactly one writer.

services:
  - type: web
    name: nightshift-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    region: frankfurt
    healthCheckPath: /ready
    numInstances: 1

    disk:
      name: nightshift-data
      mountPath: /data
      sizeGB: 10

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Set these in the Render dashboard, not here.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
