# nginx alternative to the bundled Caddy, for hosts that already run nginx.
# Pair it with certbot for certificates.

server {
    listen 443 ssl http2;
    server_name api.example.com;                 # <- your domain

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Audio uploads reach 25 MB; the default 1 MB rejects them with a 413.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generating narration for a long story is not fast.
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;

        # Audio responses stream; buffering them wastes memory for no gain.
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
